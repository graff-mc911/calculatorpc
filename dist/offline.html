<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - CPC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #2d3436 0%, #1e272e 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      opacity: 0.9;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      color: #ff6348;
    }

    p {
      font-size: 18px;
      color: #b2bec3;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      background-color: #ff6348;
      color: white;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: background-color 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .button:hover {
      background-color: #ff4f37;
    }

    .status {
      margin-top: 30px;
      padding: 12px 20px;
      background-color: rgba(255, 99, 72, 0.1);
      border: 1px solid rgba(255, 99, 72, 0.3);
      border-radius: 6px;
      font-size: 14px;
      color: #dfe6e9;
    }

    .status.online {
      background-color: rgba(0, 184, 148, 0.1);
      border-color: rgba(0, 184, 148, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>

    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Some features may not be available until you reconnect.</p>

    <button class="button" onclick="window.location.reload()">Try Again</button>

    <div class="status" id="status">
      Connection status: Offline
    </div>
  </div>

  <script>
    function updateOnlineStatus() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = 'Connection restored! Reloading...';
        status.classList.add('online');
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      } else {
        status.textContent = 'Connection status: Offline';
        status.classList.remove('online');
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Check connection periodically
    setInterval(updateOnlineStatus, 3000);
  </script>
</body>
</html>
