<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPC Icon Generator - All Platforms</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-bottom: 10px;
            color: #2B2B2B;
        }
        h2 {
            color: #FF7A00;
            margin-top: 30px;
        }
        .actions {
            margin: 20px 0;
        }
        button {
            background: #FF7A00;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            font-size: 16px;
        }
        button:hover {
            background: #E66D00;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .preview-item {
            text-align: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
        }
        .preview-item canvas {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .preview-item label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #666;
        }
        .status {
            padding: 15px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }
        .platform-section {
            margin-top: 30px;
            padding: 20px;
            background: #fafafa;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔨 CPC Icon Generator</h1>
        <p>Generate all required app icons for iOS, Android, and Web/PWA platforms</p>

        <div class="actions">
            <button onclick="generateAllIcons()">🎨 Generate All Icons</button>
            <button onclick="downloadAllIcons()">📦 Download All as ZIP</button>
        </div>

        <div id="status" class="status"></div>

        <div class="platform-section">
            <h2>📱 iOS Icons</h2>
            <div id="ios-grid" class="preview-grid"></div>
        </div>

        <div class="platform-section">
            <h2>🤖 Android Icons</h2>
            <div id="android-grid" class="preview-grid"></div>
        </div>

        <div class="platform-section">
            <h2>🌐 Web/PWA Icons</h2>
            <div id="web-grid" class="preview-grid"></div>
        </div>

        <div class="platform-section">
            <h2>🔖 Favicon Sizes</h2>
            <div id="favicon-grid" class="preview-grid"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const iconSizes = {
            ios: [1024, 180, 167, 152, 120, 87, 80, 76, 60, 58, 40, 29],
            android: [192, 144, 96, 72, 48, 36],
            web: [1024, 512, 384, 256, 192, 128, 96],
            favicon: [64, 48, 32, 16]
        };

        const generatedCanvases = {};

        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#FF7A00');
            gradient.addColorStop(1, '#FF6600');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            ctx.strokeStyle = 'white';
            ctx.lineWidth = size * 0.08;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const margin = size * 0.25;
            const endX = size - margin;
            const midY = size / 2;

            ctx.beginPath();
            ctx.moveTo(margin, margin);
            ctx.lineTo(endX, margin);
            ctx.lineTo(endX, midY);
            ctx.moveTo(margin, midY);
            ctx.lineTo(endX, midY);
            ctx.lineTo(endX, size - margin);
            ctx.lineTo(margin, size - margin);
            ctx.stroke();

            if (size >= 64) {
                ctx.fillStyle = 'white';
                ctx.font = `bold ${size * 0.15}px -apple-system, BlinkMacSystemFont, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('CPC', size / 2, size * 0.88);
            }
        }

        function createIconElement(size, platform) {
            const item = document.createElement('div');
            item.className = 'preview-item';

            const canvas = document.createElement('canvas');
            drawIcon(canvas, size);
            generatedCanvases[`${platform}-${size}`] = canvas;

            const label = document.createElement('label');
            label.textContent = `${size}x${size}`;

            item.appendChild(canvas);
            item.appendChild(label);

            return item;
        }

        function generateAllIcons() {
            document.getElementById('ios-grid').innerHTML = '';
            document.getElementById('android-grid').innerHTML = '';
            document.getElementById('web-grid').innerHTML = '';
            document.getElementById('favicon-grid').innerHTML = '';

            iconSizes.ios.forEach(size => {
                document.getElementById('ios-grid').appendChild(createIconElement(size, 'ios'));
            });

            iconSizes.android.forEach(size => {
                document.getElementById('android-grid').appendChild(createIconElement(size, 'android'));
            });

            iconSizes.web.forEach(size => {
                document.getElementById('web-grid').appendChild(createIconElement(size, 'web'));
            });

            iconSizes.favicon.forEach(size => {
                document.getElementById('favicon-grid').appendChild(createIconElement(size, 'favicon'));
            });

            const status = document.getElementById('status');
            status.textContent = '✓ All icons generated successfully!';
            status.style.display = 'block';
        }

        async function downloadAllIcons() {
            if (Object.keys(generatedCanvases).length === 0) {
                alert('Please generate icons first!');
                return;
            }

            const zip = new JSZip();

            const iosFolder = zip.folder('ios');
            const androidFolder = zip.folder('android');
            const webFolder = zip.folder('web');
            const faviconFolder = zip.folder('favicon');

            for (const [key, canvas] of Object.entries(generatedCanvases)) {
                const [platform, size] = key.split('-');
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

                if (platform === 'ios') {
                    iosFolder.file(`icon-${size}x${size}.png`, blob);
                    if (size === '180' || size === '120' || size === '152') {
                        iosFolder.file(`apple-touch-icon-${size}x${size}.png`, blob);
                    }
                } else if (platform === 'android') {
                    androidFolder.file(`icon-${size}x${size}.png`, blob);
                } else if (platform === 'web') {
                    webFolder.file(`icon-${size}x${size}.png`, blob);
                } else if (platform === 'favicon') {
                    faviconFolder.file(`favicon-${size}x${size}.png`, blob);
                }
            }

            const content = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(content);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cpc-icons-all-platforms.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            const status = document.getElementById('status');
            status.textContent = '✓ Icons downloaded as ZIP file!';
            status.style.display = 'block';
        }

        window.onload = () => {
            generateAllIcons();
        };
    </script>
</body>
</html>
