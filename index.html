<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Strip stale PWA query (?utm_source) before iOS Add to Home Screen reads the URL */
      (function () {
        try {
          var u = new URL(location.href);
          var keys = ['utm_source', 'utm_medium', 'utm_campaign', 'cpc_refresh'];
          var dirty = false;
          for (var i = 0; i < keys.length; i++) {
            if (u.searchParams.has(keys[i])) {
              u.searchParams.delete(keys[i]);
              dirty = true;
            }
          }
          if (dirty) {
            location.replace(u.pathname + (u.search ? u.search : '') + u.hash);
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
